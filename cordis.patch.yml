# dsh-heartprint 默认配置
#
# 所有字段都可以在 profile 的 patch 层覆盖；运行时用
# heartprint_admin action=policy 改的值存在数据目录，优先级更高。
- insert:
    - id: heartprint
      name: 'dsh-heartprint'
      config:
        # 留空 = <DSH_HOME>/heartprint
        dataDir: ''
        disclosure: confidential
        syncIntervalDays: 30
