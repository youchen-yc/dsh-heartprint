# dsh-heartprint bundle patch
#
# The row below is the default composition. Every field can be overridden from
# the profile's own patch layer; runtime policy edits made through
# `heartprint_admin action=policy` are stored in the data directory and take
# precedence over these values.
- insert:
    - id: heartprint
      name: 'dsh-heartprint'
      config:
        # Empty means: <DSH_HOME>/heartprint
        dataDir: ''
        # confidential | disclosed — whether the memory document has been
        # handed to the user yet (see the plugin README, section 交付).
        disclosure: confidential
        # How often the third, encrypted-and-hidden document is refreshed.
        syncIntervalDays: 30
